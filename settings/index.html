<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Google Docs</title> <link rel="stylesheet" href="/main.css">
    <script src="/uv/uv.bundle.js" defer></script>
    <script src="/uv/uv.config.js" defer></script>
    <script src="/register-sw.js" defer></script>
    <script src="/scripts/index.js" defer></script>
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; overflow: hidden; }
        .search-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; transition: 0.5s; }
        #uv-form { width: 80%; max-width: 500px; display: flex; gap: 10px; }
        #uv-address { flex: 1; padding: 12px 20px; border-radius: 20px; border: 1px solid #444; background: #222; color: white; outline: none; }
        #uv-frame { display: none; width: 100vw; height: 100vh; border: none; position: fixed; top: 0; left: 0; background: white; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="search-container" id="main-ui">
        <h1 style="font-weight: 100; color: #aaa;">Search</h1>
        <form id="uv-form">
            <input id="uv-address" type="text" placeholder="Search or type a URL" autocomplete="off">
        </form>
    </div>
    <iframe id="uv-frame"></iframe>
</body>
</html>
